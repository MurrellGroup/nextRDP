name: Deploy RDP Web to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static WASM site
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check source/worker ABI contracts
        run: npm run check:source

      - name: Check TypeScript contracts
        run: npm run check:types

      - name: Check primary BootScan core and cache
        run: npm run check:bootscan-core

      - name: Check supplied-source event-tree core
        run: npm run check:tree-core

      - name: Build WASM and web application
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    name: Publish GitHub Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
